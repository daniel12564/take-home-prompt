services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay -d relay']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: uv run python manage.py runserver 0.0.0.0:8000
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://relay:relay@db:5432/relay}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    volumes:
      - ./backend:/app
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    ports:
      - '${WEB_PORT:-5173}:5173'
    depends_on:
      - api

volumes:
  db-data:
  web-node-modules:
